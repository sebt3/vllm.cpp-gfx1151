name: rocm-gfx1151

# Fork-only workflow: builds ONE image, docker/Dockerfile.rocm-gfx1151, for ONE
# target (ROCm, gfx1151 / Strix Halo). Deliberately separate from any upstream
# containers.yml-style multi-lane matrix: this lane is not part of
# release/container-matrix.json and must never need to satisfy its checks.
#
# A hosted runner has no gfx1151 device, so this workflow proves the image
# COMPILES and LINKS against the pinned TheRock SDK -- not that it runs
# correctly. Real-hardware validation (ctest -R 'rocm|cross_device', an actual
# model load) stays a manual step on the Strix Halo box; see docs/ROCM.md
# Sec.5.2 for that recipe.

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.rocm-gfx1151'
      - 'scripts/build-rocm-gfx1151-release.sh'
      - '.github/workflows/rocm-gfx1151.yml'
      - 'src/vt/rocm/**'
      - 'src/vllm/platforms/rocm.cpp'
      - 'include/vt/rocm/**'
      - 'include/vt/device.h'
      - 'CMakeLists.txt'
    # Fork-local version tags for this one image, e.g. v0.0.2-alpha.1.
    # Deliberately not the upstream release.yml v* contract (that tag means
    # "the vllm_cpp CMake VERSION", checked against CMakeLists.txt) -- this
    # tag just names a build of this lane and carries no such promise.
    tags: ['v*']
  pull_request:
    paths:
      - 'docker/Dockerfile.rocm-gfx1151'
      - 'scripts/build-rocm-gfx1151-release.sh'
      - '.github/workflows/rocm-gfx1151.yml'
      - 'src/vt/rocm/**'
      - 'src/vllm/platforms/rocm.cpp'
      - 'include/vt/rocm/**'
      - 'include/vt/device.h'
      - 'CMakeLists.txt'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push the built image to ghcr.io even on a non-main ref'
        type: boolean
        default: false
      version_tag:
        description: 'Extra ghcr.io tag to push alongside :main/:<sha> (e.g. v0.0.2-alpha.1); blank = none'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rocm-gfx1151-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sebt3/vllm.cpp-gfx1151/rocm-gfx1151

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the gfx1151 ROCm image
        run: |
          set -euo pipefail
          docker buildx build \
            --file docker/Dockerfile.rocm-gfx1151 \
            --platform linux/amd64 \
            --tag vllm-cpp-rocm-gfx1151:verify \
            --load \
            .

      - name: Sanity-check the built image
        run: |
          set -euo pipefail
          # No gfx1151 device on this runner, so this proves the binary and
          # its bundled runtime libs resolve -- not that inference runs.
          # `grep -v "not found"` alone is NOT this check: it passes as soon as
          # ANY line lacks that string, which libc.so.6/libstdc++.so.6 always
          # guarantee regardless of whether the ROCm libs resolved. A real
          # deploy hit `libamdhip64.so.7 => not found` while this passed green
          # (docker/Dockerfile.rocm-gfx1151 shipped an empty lib/ dir because
          # the builder stage had no LD_LIBRARY_PATH for ldd to resolve
          # against). Assert the negative directly, and name the libs we
          # actually expect to be bundled.
          docker run --rm --entrypoint /bin/sh vllm-cpp-rocm-gfx1151:verify -c '
            set -eux
            test -x /opt/vllm/bin/vllm-server
            test -x /opt/vllm/bin/vllm-healthcheck
            ldd /opt/vllm/bin/vllm-server
            ! ldd /opt/vllm/bin/vllm-server | grep -qi "not found"
            for lib in libamdhip64.so.7 libhipblas.so.3 libhipblaslt.so.1; do
              test -e "/opt/vllm/lib/$lib"
            done
          '

      - name: Log in to ghcr.io
        if: github.event_name == 'push' || inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: github.event_name == 'push' || inputs.push_image
        run: |
          set -euo pipefail
          docker tag vllm-cpp-rocm-gfx1151:verify "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # An immutable version tag: refuse to overwrite one that already
            # exists, same rule upstream's containers.yml uses for its own
            # v* tags.
            if docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "::error::${IMAGE}:${GITHUB_REF_NAME} already exists; version tags are immutable" >&2
              exit 1
            fi
            docker tag vllm-cpp-rocm-gfx1151:verify "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag vllm-cpp-rocm-gfx1151:verify "${IMAGE}:main"
            docker push "${IMAGE}:main"
          fi
          if [ -n "${VERSION_TAG:-}" ]; then
            docker tag vllm-cpp-rocm-gfx1151:verify "${IMAGE}:${VERSION_TAG}"
            docker push "${IMAGE}:${VERSION_TAG}"
          fi
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
